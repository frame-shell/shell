# {{name}} – window borders and the empty-desktop color. Generated by `frame theme`;
# edit themes/templates/hypr/.config/hypr/frame/colors.conf instead.
# Sourced from frame/shell.conf after your own settings, so these win; drop the
# source line in shell.conf to keep your own border colors.
# Hyprland reloads by itself when this file changes.

general {
    col.active_border = rgb({{colors.primary|bare}})
    col.inactive_border = rgb({{colors.surface2|bare}})
}

group {
    col.border_active = rgb({{colors.primary|bare}})
    col.border_inactive = rgb({{colors.surface2|bare}})
}

misc {
    background_color = rgb({{colors.bg|bare}})
}
