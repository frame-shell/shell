; frameshell: dark GTK 3 apps, JetBrains Mono like everywhere else (the adw-gtk3 look when
; adw-gtk-theme is installed; frame sets it through gsettings then).
; The colors come from gtk.css next to this file (frame theme).
[Settings]
gtk-application-prefer-dark-theme=1
gtk-font-name=JetBrains Mono 10
gtk-decoration-layout=:
