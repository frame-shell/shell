; frameshell: dark GTK 3 apps in the adw-gtk3 look, JetBrains Mono like everywhere else.
; The colors come from gtk.css next to this file (frame theme).
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1
gtk-font-name=JetBrains Mono 10
gtk-icon-theme-name=breeze-dark
gtk-decoration-layout=:
