# Quickshell modules: autostart, keybinds, idle.
# Sourced from hyprland.conf; `roxy install hypr` adds that line.

# Quickshell runs the lockscreen and launcher (later also bar and notifications)
exec-once = qs
# Locks after idle time and before sleep, see hypridle.conf
exec-once = hypridle

bind = SUPER, L, exec, qs ipc call lock lock
bind = SUPER, SPACE, exec, qs ipc call launcher toggle
bind = SUPER, C, exec, qs ipc call controlcenter toggle

misc {
    # A restarted Quickshell can take over the lock after a crash
    allow_session_lock_restore = true
}
