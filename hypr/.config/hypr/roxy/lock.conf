# Lockscreen (Quickshell). Sourced from hyprland.conf; `roxy install hypr` adds that line.

# Quickshell runs the lockscreen (later also bar, launcher, notifications)
exec-once = qs
# Locks after idle time and before sleep, see hypridle.conf
exec-once = hypridle

bind = SUPER, L, exec, qs ipc call lock lock

misc {
    # A restarted Quickshell can take over the lock after a crash
    allow_session_lock_restore = true
}
