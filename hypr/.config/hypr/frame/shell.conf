# Quickshell modules: autostart, keybinds, idle.
# Sourced from hyprland.conf; `frame install hypr` adds that line.

# Quickshell runs the lockscreen and launcher (later also bar and notifications)
exec-once = qs
# Locks after idle time and before sleep, see hypridle.conf
exec-once = hypridle
# Starts the wallpaper backend picked in the wallpaper app (frame wallpaper backend …)
exec-once = ~/.local/bin/frame-wallpaper apply

bind = SUPER, L, exec, qs ipc call lock lock
bind = SUPER, SPACE, exec, qs ipc call launcher toggle
bind = SUPER, C, exec, qs ipc call controlcenter toggle
bind = SUPER, W, exec, qs ipc call wallpapers toggle

misc {
    # A restarted Quickshell can take over the lock after a crash
    allow_session_lock_restore = true
}

# Dolphin, Zed and Zen: environment and keybinds
source = ~/.config/hypr/frame/apps.conf

# Window border colors of the active theme (written by frame theme)
source = ~/.config/hypr/frame/colors.conf
