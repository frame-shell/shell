# Idle and sleep handling. lock_cmd is what `loginctl lock-session` runs.
# hypridle keeps its own config format; only the hyprctl commands are Lua (Hyprland 0.55+).
general {
    lock_cmd = qs ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    # Wait for the lockscreen before the system goes to sleep
    inhibit_sleep = 3
}

# Lock after 10 minutes
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Screens off 5 minutes later
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
